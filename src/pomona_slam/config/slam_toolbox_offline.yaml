# SLAM Toolbox — offline replay (process a rosbag, no live drivers).

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    odom_frame: odom
    map_frame:  map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 5.0
    # Higher throttle to process bag faster
    throttle_scans: 1
    transform_publish_period: 0.0
