#
# pointcloud_to_laserscan parameters for Robosense LiDAR → /scan.
# Values lifted from goldmines/.../bringup_minimal.launch (the real robot).

pointcloud_to_laserscan:
  ros__parameters:
    target_frame:        base_link
    transform_tolerance: 0.01
    min_height:         -0.25
    max_height:          0.50
    angle_min:          -2.0933333    # -120°
    angle_max:           2.0933333    # +120°
    angle_increment:     0.003        # ~0.17° per point
    scan_time:           0.1
    range_min:           0.2
    range_max:         100.0
    use_inf:             true
    inf_epsilon:         1.0
    concurrency_level:   1
