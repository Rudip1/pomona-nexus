# =============================================================================
# pomona_navigation / config / robots / pomona_uvc.yaml
# =============================================================================
# Robot profile for Pomona (Scout V2 base + UV-C boom).
#
# A rewrite table applied by compose_params.py on top of the merged
# (nav2_base ⊕ controllers/<ctrl> ⊕ planners/NavFn [⊕ localization/amcl]) file.
# Strict mode: every dotted key must already exist in the merged params.
#
# SOURCES OF TRUTH
#   • footprint: Scout V2 base 0.925 × 0.380 m (scout_v2.xacro);
#     base_link sits at the geometric centre → symmetric polygon.
#     The UV-C boom (panels at ±1.5 m) rides at ~1.06 m AGL, ABOVE the 1.0 m
#     costmap height band, so it is intentionally NOT in the 2D footprint.
#   • velocity: Scout V2 rated 1.5 m/s; throttled to 0.5 m/s for the greenhouse.
#   • scan ranges: 2D LiDAR usable range 5 m (gazebo_plugins.xacro).
# =============================================================================

robot:
  name: Pomona UV-C
  base_frame: base_footprint
  odom_frame: odom
  map_frame: map
  base_length_m: 0.925
  base_width_m: 0.380
  drive_type: differential
  scan_source: rslidar_2d         # 360° 2D LiDAR → /scan

# =============================================================================
# REWRITES — always applied (strict)
# =============================================================================
rewrites:

  # ── Footprint — Scout V2 base, symmetric about base_link ──────────────────
  local_costmap.local_costmap.ros__parameters.footprint:  "[[0.46, 0.19], [0.46, -0.19], [-0.46, -0.19], [-0.46, 0.19]]"
  global_costmap.global_costmap.ros__parameters.footprint: "[[0.46, 0.19], [0.46, -0.19], [-0.46, -0.19], [-0.46, 0.19]]"

  # ── Velocity smoother — greenhouse policy [vx, vy, wz] (diff-drive vy=0) ───
  velocity_smoother.ros__parameters.max_velocity: [0.5, 0.0, 1.0]
  velocity_smoother.ros__parameters.min_velocity: [-0.5, 0.0, -1.0]
  velocity_smoother.ros__parameters.max_accel:    [1.5, 0.0, 2.0]
  velocity_smoother.ros__parameters.max_decel:    [-1.5, 0.0, -2.0]

  # ── Goal checker — furrow-friendly tolerance ──────────────────────────────
  controller_server.ros__parameters.general_goal_checker.xy_goal_tolerance:  0.20
  controller_server.ros__parameters.general_goal_checker.yaw_goal_tolerance: 0.30

# =============================================================================
# CONTROLLER-FAMILY OVERRIDES — applied only for the matching controller
# (each plugin names velocity limits differently, so they cannot live above)
# =============================================================================
controller_overrides:

  mppi:
    controller_server.ros__parameters.FollowPath.vx_max:  0.5
    controller_server.ros__parameters.FollowPath.vx_min: -0.35
    controller_server.ros__parameters.FollowPath.wz_max:  1.0
    controller_server.ros__parameters.FollowPath.ax_max:  1.5
    controller_server.ros__parameters.FollowPath.ax_min: -1.5

  dwb:
    controller_server.ros__parameters.FollowPath.max_vel_x:     0.5
    controller_server.ros__parameters.FollowPath.min_vel_x:     0.0
    controller_server.ros__parameters.FollowPath.max_vel_theta: 1.0
    controller_server.ros__parameters.FollowPath.max_speed_xy:  0.5
    controller_server.ros__parameters.FollowPath.acc_lim_x:     1.5
    controller_server.ros__parameters.FollowPath.acc_lim_theta: 2.0
    controller_server.ros__parameters.FollowPath.decel_lim_x:     -1.5
    controller_server.ros__parameters.FollowPath.decel_lim_theta: -2.0
